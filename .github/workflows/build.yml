name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug -PappVersionCode=$((GITHUB_RUN_NUMBER + 40)) --stacktrace --info --refresh-dependencies 2>&1 | tee "$RUNNER_TEMP/build-debug.log"

      - name: Report build failure details
        if: failure()
        shell: python
        run: |
          import os, pathlib, re, xml.etree.ElementTree as ET
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'build-debug.log'
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              starts = [i for i, line in enumerate(lines) if 'FAILURE: Build failed' in line]
              details = '\n'.join(lines[starts[-1]:starts[-1] + 65] if starts else lines[-65:])
              escaped = details[:12000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=Build failure summary::{escaped}')
          for report in pathlib.Path('app/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      details = f"{case.get('classname')}.{case.get('name')}: {failure.get('message')}\n{failure.text or ''}"
                      escaped = details[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::warning title=Failed unit test::{escaped}')

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ runner.temp }}/build-debug.log
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Paperlight-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build consistently signed release APK when signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Release signing secrets are not configured. Only a debug APK was built; it may not update an existing installation. Configure the original signing key before distributing update APKs."
            exit 0
          fi
          trap 'rm -f "$RUNNER_TEMP/vibe-reader-release.jks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vibe-reader-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/vibe-reader-release.jks"
          gradle :app:assembleRelease -PappVersionCode=$((GITHUB_RUN_NUMBER + 40)) --stacktrace

      - name: Verify release APK signature
        if: ${{ hashFiles('app/build/outputs/apk/release/app-release.apk') != '' }}
        env:
          ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          if [ -n "$ANDROID_EXPECTED_CERT_SHA256" ]; then
            actual=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
            expected=$(printf '%s' "$ANDROID_EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test -n "$actual" && test "$actual" = "$expected" || { echo "::error::Release APK certificate does not match ANDROID_EXPECTED_CERT_SHA256"; exit 1; }
          fi

      - name: Upload release APK
        if: ${{ hashFiles('app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Paperlight-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
